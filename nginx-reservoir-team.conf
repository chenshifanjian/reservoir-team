# 组队协调服务 · nginx 反代配置（参考模板）
#
# 上游：127.0.0.1:5022（协调服务，只监听回环，不直接暴露公网）
#
# 用法：把下面 location 块填进你自己的反代站点（1Panel 面板 / 原生 nginx 均可），
#       站点域名换成你自己解析到这台机器的域名，配上你自己的证书。
#
# ---- 1Panel 的坑（踩过，务必知道）----
# ① 建站时「上游协议」要选 http:// —— TLS 在 nginx 这层终结，
#    写成 https://127.0.0.1:5022 会得到「回环 200、公网 502」（error.log 里
#    upstream 显示 https:// 即是此因）。写 https 还需去掉 proxy_ssl_server_name。
# ② 1Panel 的站点配置**双写**：文件系统 <站点目录>/proxy/*.conf
#    与面板数据库各存一份。只改文件系统的话，下次在面板点保存会被覆盖回去。
#    所以要改配置请走面板；手工改文件只适合临时调试。
# ③ 改完务必 `nginx -t` 再 reload。

# ---- 反代到协调服务 ----
location / {
    proxy_pass http://127.0.0.1:5022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    # 协调服务响应很快（几十毫秒），不需要长超时
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # 请求体上限：密文包单个最大 64KB，给 1MB 余量
    client_max_body_size 1m;
}

# ---- 健康检查路径（给监控用，不带鉴权）----
location = /health {
    proxy_pass http://127.0.0.1:5022/health;
    proxy_http_version 1.1;
    access_log off;
}

# ---- 安全响应头 ----
# 协调服务只返回 JSON，不需要任何缓存，也不该被嵌进别的页面
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
